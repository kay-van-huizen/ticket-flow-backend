spring.datasource.url=jdbc:h2:mem:ticketflow-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# data.sql is PostgreSQL oriented; tests create their own data
spring.sql.init.mode=never

# Dummy values: NimbusJwtDecoder only fetches the JWK set when a real bearer token is decoded
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:0/test/certs
app.security.issuer=http://localhost:0/test

app.storage.path=${java.io.tmpdir}/ticketflow-test-uploads
